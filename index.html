<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Üye Takip Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Şifre Giriş Ekranı -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-xl font-bold mb-4 text-emerald-400">Salon Takip Girişi</h2>
            <p class="text-sm text-slate-400 mb-4">Lütfen erişim şifresini girin.</p>
            <input type="password" id="passwordInput" placeholder="Şifre" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 mb-4 text-center text-lg focus:outline-none focus:border-emerald-500">
            <button onclick="checkPassword()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-semibold py-3 rounded-xl transition">Giriş Yap</button>
            <p id="loginError" class="text-rose-500 text-sm mt-3 hidden">Hatalı şifre!</p>
        </div>
    </div>

    <!-- Ana Uygulama -->
    <div id="appContainer" class="max-w-md mx-auto p-4 hidden">
        <header class="flex justify-between items-center mb-6 pt-2">
            <h1 class="text-xl font-bold text-emerald-400">Salon Takip</h1>
            <div class="space-x-2">
                <button onclick="switchTab('list')" id="btnList" class="bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl font-semibold text-sm">Üyeler</button>
                <button onclick="switchTab('add')" id="btnAdd" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl font-semibold text-sm">+ Üye Ekle</button>
            </div>
        </header>

        <!-- Arama ve Özet -->
        <div id="listView">
            <div class="bg-slate-800/50 border border-slate-800 p-4 rounded-2xl mb-4">
                <input type="text" id="searchInput" oninput="renderMembers()" placeholder="İsim veya telefon ile ara..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm mb-3 focus:outline-none focus:border-emerald-500">
                <div class="text-xs text-slate-400 text-center">Toplam Üye: <span id="totalCount" class="text-emerald-400 font-bold">0</span></div>
            </div>

            <div id="memberList" class="space-y-3 pb-10">
                <!-- Üyeler buraya listelenecek -->
            </div>
        </div>

        <!-- Üye Ekleme Formu -->
        <div id="addView" class="hidden bg-slate-800/50 border border-slate-800 p-5 rounded-2xl">
            <h2 class="text-lg font-bold mb-4 text-slate-200">Yeni Üye Kaydı</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Ad Soyad</label>
                    <input type="text" id="nameInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Telefon Numarası</label>
                    <input type="tel" id="phoneInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Üyelik Paketi / Süresi</label>
                    <select id="packageInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="1 Aylık">1 Aylık</option>
                        <option value="3 Aylık">3 Aylık</option>
                        <option value="6 Aylık">6 Aylık</option>
                        <option value="Yıllık">Yıllık</option>
                    </select>
                </div>
                <button onclick="addMember()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-3 rounded-xl transition mt-2">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // Şifre Kontrolü
        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === 'belediye03') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                localStorage.setItem('salonAuth', 'true');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        // Oturum Hafızası
        window.onload = function() {
            if (localStorage.getItem('salonAuth') === 'true') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
            }
        }

        // Yerel & Güvenli Veri Yönetimi
        let members = JSON.parse(localStorage.getItem('salonMembers')) || [];

        function switchTab(tab) {
            const listView = document.getElementById('listView');
            const addView = document.getElementById('addView');
            const btnList = document.getElementById('btnList');
            const btnAdd = document.getElementById('btnAdd');

            if (tab === 'list') {
                listView.classList.remove('hidden');
                addView.classList.add('hidden');
                btnList.className = "bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl font-semibold text-sm";
                btnAdd.className = "bg-slate-800 text-slate-300 px-4 py-2 rounded-xl font-semibold text-sm";
                renderMembers();
            } else {
                listView.classList.add('hidden');
                addView.classList.remove('hidden');
                btnAdd.className = "bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl font-semibold text-sm";
                btnList.className = "bg-slate-800 text-slate-300 px-4 py-2 rounded-xl font-semibold text-sm";
            }
        }

        function addMember() {
            const name = document.getElementById('nameInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const pkg = document.getElementById('packageInput').value;

            if (!name) {
                alert('Lütfen üye adını girin.');
                return;
            }

            const newMember = {
                id: Date.now(),
                name: name,
                phone: phone || 'Belirtilmemiş',
                package: pkg,
                date: new Date().toLocaleDateString('tr-TR')
            };

            members.push(newMember);
            saveAndRender();

            // Formu temizle ve listeye dön
            document.getElementById('nameInput').value = '';
            document.getElementById('phoneInput').value = '';
            switchTab('list');
        }

        function deleteMember(id) {
            if (confirm('Bu üyeyi silmek istediğinize emin misiniz?')) {
                members = members.filter(m => m.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('salonMembers', JSON.stringify(members));
            renderMembers();
        }

        function renderMembers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const listEl = document.getElementById('memberList');
            const filtered = members.filter(m => m.name.toLowerCase().includes(search) || m.phone.includes(search));

            document.getElementById('totalCount').innerText = members.length;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">Kayıtlı üye bulunamadı.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(m => `
                <div class="bg-slate-800/40 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-slate-200">${m.name}</h3>
                        <p class="text-xs text-slate-400 mt-0.5">📞 ${m.phone} • <span class="text-emerald-400">${m.package}</span></p>
                        <p class="text-[10px] text-slate-500 mt-1">Kayıt: ${m.date}</p>
                    </div>
                    <button onclick="deleteMember(${m.id})" class="text-rose-400 hover:text-rose-300 text-xs bg-rose-500/10 px-3 py-1.5 rounded-lg border border-rose-500/20">Sil</button>
                </div>
            `).join('');
        }

        renderMembers();
    </script>
</body>
</html>
